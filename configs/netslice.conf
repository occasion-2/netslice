# /etc/netslice.conf
# Configuration for Netslice - Selective TUN Proxy Router

# The TUN interface created by your proxy software (e.g., tun0, xray_tun, sing_tun)
NETSLICE_TUN_DEV="xray_tun"

# The systemd slice that netslice will manage and route
NETSLICE_SLICE="system-netslice.slice"

# The firewall mark (fwmark) used by nftables and iproute2 to identify proxied traffic
NETSLICE_FWMARK="5555"

# The routing table ID used for the proxy route
NETSLICE_TABLE="101"

# The default gateway IP assigned to the TUN interface (used for the hijack route)
# This usually matches your proxy's internal TUN gateway configuration.
NETSLICE_GATEWAY_IP="10.255.255.1"

# Literal NAME=value assignments only; shell expansion and commands are rejected.
# The established system-netslice.slice name is fixed in the installed units.
NETSLICE_PREFIXLEN="24"
NETSLICE_RULE_PRIORITY="10555"
NETSLICE_POLL_SEC="2"
# Netslice reserves IPv4 table 101, full mark 5555, and route/rule protocol 186.
# Protected external IPv6 is blocked, including when the TUN has IPv6 addresses.
